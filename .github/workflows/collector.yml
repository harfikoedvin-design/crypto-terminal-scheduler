name: Crypto Terminal Collector

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: crypto-terminal-collector
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Request bounded GitHub OIDC token
        id: oidc
        shell: bash
        env:
          OIDC_AUDIENCE: crypto-futures-terminal-collector-v1
        run: |
          set -euo pipefail
          token_json="$(curl --fail --silent --show-error             -H "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}"             "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=${OIDC_AUDIENCE}")"
          oidc_token="$(jq -er '.value' <<<"${token_json}")"
          echo "::add-mask::${oidc_token}"
          echo "token=${oidc_token}" >> "${GITHUB_OUTPUT}"

      - name: Verify public OIDC claim shape
        shell: bash
        env:
          OIDC_TOKEN: ${{ steps.oidc.outputs.token }}
        run: |
          set -euo pipefail
          node -e '
            const payload = process.env.OIDC_TOKEN.split(".")[1];
            const claims = JSON.parse(Buffer.from(payload, "base64url").toString("utf8"));
            const safe = {
              iss: claims.iss,
              aud: claims.aud,
              sub: claims.sub,
              repository: claims.repository,
              repository_visibility: claims.repository_visibility,
              ref: claims.ref,
              event_name: claims.event_name,
              workflow_ref: claims.workflow_ref,
              iat: claims.iat,
              nbf: claims.nbf,
              exp: claims.exp
            };
            console.log(JSON.stringify(safe));
          '

      - name: Run terminal background collector
        shell: bash
        env:
          OIDC_TOKEN: ${{ steps.oidc.outputs.token }}
          SITES_ACCESS_BYPASS_TOKEN: ${{ secrets.SITES_ACCESS_BYPASS_TOKEN }}
        run: |
          set -euo pipefail
          test -n "${SITES_ACCESS_BYPASS_TOKEN}"

          response_file="$(mktemp)"
          http_status="$(curl --silent --show-error             --output "${response_file}"             --write-out "%{http_code}"             --request POST             --header "Authorization: Bearer ${OIDC_TOKEN}"             --header "OAI-Sites-Authorization: Bearer ${SITES_ACCESS_BYPASS_TOKEN}"             "https://crypto-futures-terminal.harfikoedvin.chatgpt.site/api/background/github")"

          if [[ "${http_status}" != "200" ]]; then
            echo "Collector failed with HTTP ${http_status}"
            sed -n '1,20p' "${response_file}"
            exit 1
          fi

          jq -c '{status, cycleId, startedAt, completedAt, scanner, telegram}' "${response_file}"
